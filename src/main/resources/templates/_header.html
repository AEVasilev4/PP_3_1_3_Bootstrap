<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="header">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background-color: #343a40;
        }
        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: #fff;
        }
        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #fff;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #0d6efd;
            padding: 12px 20px;
            border-radius: 0;
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
        }
        .sidebar .nav-link:hover:not(.active) {
            background-color: #f8f9fa;
        }
        .main-content {
            padding: 20px;
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-dark navbar-custom">
    <div class="container-fluid">
<span class="navbar-brand mb-0 h1">
    <span th:if="${#authentication != null and #authentication.name != null}"
          th:text="${#authentication.name}">username</span>
    <span th:unless="${#authentication != null}" th:text="'Guest'">Guest</span>

    <span th:if="${#authentication != null}"> with roles:
        <span th:each="auth, iterStat : ${#authentication.authorities}">
            <span th:text="${auth.getAuthority().replace('ROLE_', '')}"></span>
            <span th:if="${!iterStat.last}"> </span>
        </span>
    </span>
</span>

        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-link text-light text-decoration-none">Logout</button>
        </form>
    </div>
</nav>
</body>
</html>
