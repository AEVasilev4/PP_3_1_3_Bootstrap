<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background-color: #343a40;
        }
        .navbar-custom .navbar-brand {
            color: #fff;
            font-weight: bold;
        }
        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #fff;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #0d6efd;
            padding: 12px 20px;
            border-radius: 0;
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
        }
        .sidebar .nav-link:hover:not(.active) {
            background-color: #f8f9fa;
        }
        .main-content {
            padding: 20px;
        }
        .form-label {
            font-weight: bold;
            text-align: center;
        }
        .form-control, .form-select {
            max-width: 400px;
            margin: 0 auto;
        }
        .btn-add {
            background-color: #198754;
            border: none;
            color: #fff;
            padding: 10px 30px;
        }
        .btn-add:hover {
            background-color: #157347;
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-dark navbar-custom">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            <!-- Безопасное получение имени пользователя -->
            <span th:if="${#authentication != null and #authentication.name != null}"
                  th:text="${#authentication.name}">username</span>
            <span th:unless="${#authentication != null}" th:text="'Guest'">Guest</span>

            <!-- Безопасное получение ролей -->
            <span th:if="${#authentication != null}"> with roles:
                <span th:each="auth, iterStat : ${#authentication.authorities}">
                    <span th:text="${auth.getAuthority().replace('ROLE_', '')}"></span>
                    <span th:if="${!iterStat.last}"> </span>
                </span>
            </span>
        </span>

        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-link text-light text-decoration-none">Logout</button>
        </form>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <nav class="nav flex-column mt-2">
                <a class="nav-link active" href="/admin">Admin</a>
                <a class="nav-link" href="/user">User</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">
            <h1 class="mb-4">Admin panel</h1>

            <!-- Tabs -->
            <ul class="nav nav-tabs mb-3" id="adminTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <a class="nav-link" th:href="@{/admin}" role="tab">Users table</a>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="new-user-tab" type="button" role="tab">New User</button>
                </li>
            </ul>

            <!-- Form -->
            <div class="card">
                <div class="card-header">Add new user</div>
                <div class="card-body">
                    <form th:action="@{/admin}" th:object="${user}" method="post">
                        <div class="mb-3">
                            <label class="form-label">First name</label>
                            <input type="text" class="form-control" th:field="*{username}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Last name</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" class="form-control" th:field="*{age}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" th:field="*{password}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-select" name="roles" multiple required>
                                <option th:each="role : ${allRoles}"
                                        th:value="${role.id}"
                                        th:text="${role.name}">
                                </option>
                            </select>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-add">Add new user</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
