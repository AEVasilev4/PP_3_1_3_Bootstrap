<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background-color: #343a40;
        }
        .navbar-custom .navbar-brand {
            color: #fff;
            font-weight: bold;
        }
        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #fff;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #0d6efd;
            padding: 12px 20px;
            border-radius: 0;
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
        }
        .sidebar .nav-link:hover:not(.active) {
            background-color: #f8f9fa;
        }
        .main-content {
            padding: 20px;
        }
        .btn-edit {
            background-color: #0dcaf0;
            border: none;
            color: #fff;
        }
        .btn-edit:hover {
            background-color: #31d2f2;
        }
        .btn-delete {
            background-color: #dc3545;
            border: none;
            color: #fff;
        }
        .btn-delete:hover {
            background-color: #bb2d3b;
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-dark navbar-custom">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">

            <span th:if="${#authentication != null and #authentication.name != null}"
                  th:text="${#authentication.name}">username</span>
            <span th:unless="${#authentication != null}" th:text="'Guest'">Guest</span>


            <span th:if="${#authentication != null}"> with roles:
                <span th:each="auth, iterStat : ${#authentication.authorities}">
                    <span th:text="${auth.getAuthority().replace('ROLE_', '')}"></span>
                    <span th:if="${!iterStat.last}"> </span>
                </span>
            </span>
        </span>

        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-link text-light text-decoration-none">Logout</button>
        </form>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <nav class="nav flex-column mt-2">
                <a class="nav-link active" href="/admin">Admin</a>
                <a class="nav-link" href="/user">User</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">
            <h1 class="mb-4">Admin panel</h1>

            <!-- Tabs -->
            <ul class="nav nav-tabs mb-3" id="adminTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="users-tab" data-bs-toggle="tab"
                            data-bs-target="#users-table" type="button" role="tab">Users table</button>
                </li>
                <li class="nav-item" role="presentation">
                    <a class="nav-link" th:href="@{/admin/new}" role="tab">New User</a>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content" id="adminTabsContent">
                <div class="tab-pane fade show active" id="users-table" role="tabpanel">
                    <div class="card">
                        <div class="card-header">All users</div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-striped mb-0">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Age</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.id}"></td>
                                        <td th:text="${user.username}"></td>
                                        <td th:text="${user.name}"></td>
                                        <td th:text="${user.age}"></td>
                                        <td th:text="${user.email}"></td>
                                        <td>
                                            <!-- Безопасный вывод ролей -->
                                            <span th:if="${user.roles != null}"
                                                  th:each="role : ${user.roles}"
                                                  th:text="${role.name} + ' '"></span>
                                        </td>
                                        <td>
                                            <button class="btn btn-edit btn-sm"
                                                    th:onclick="'showEditModal(' + ${user.id} + ')'">Edit</button>
                                        </td>
                                        <td>
                                            <button class="btn btn-delete btn-sm"
                                                    th:onclick="'showDeleteModal(' + ${user.id} + ')'">Delete</button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit User Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editForm" th:action="@{/admin/update}" method="post">
                    <input type="hidden" name="id" id="editId">

                    <div class="mb-3">
                        <label class="form-label fw-bold">ID</label>
                        <input type="text" class="form-control" id="editIdDisplay" readonly disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">First name</label>
                        <input type="text" class="form-control" name="username" id="editUsername" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Last name</label>
                        <input type="text" class="form-control" name="name" id="editName" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Age</label>
                        <input type="number" class="form-control" name="age" id="editAge" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control" name="email" id="editEmail" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" name="password" id="editPassword" placeholder="Leave blank to keep current">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Role</label>
                        <select class="form-select" name="roles" multiple id="editRoles">
                            <option value="1">ADMIN</option>
                            <option value="2">USER</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" form="editForm" class="btn btn-primary">Edit</button>
            </div>
        </div>
    </div>
</div>

<!-- Delete User Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="deleteForm" th:action="@{/admin/delete/}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">ID</label>
                        <input type="text" class="form-control" id="deleteIdDisplay" readonly disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">First name</label>
                        <input type="text" class="form-control" id="deleteUsername" readonly disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Last name</label>
                        <input type="text" class="form-control" id="deleteName" readonly disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Age</label>
                        <input type="text" class="form-control" id="deleteAge" readonly disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="text" class="form-control" id="deleteEmail" readonly disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Role</label>
                        <select class="form-select" id="deleteRoles" multiple disabled>
                            <option value="1">ADMIN</option>
                            <option value="2">USER</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" form="deleteForm" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Данные пользователей для модальных окон
    const usersData = {};
    document.querySelectorAll('tbody tr').forEach(row => {
        const cells = row.querySelectorAll('td');
        const id = cells[0].textContent;
        usersData[id] = {
            id: id,
            username: cells[1].textContent,
            name: cells[2].textContent,
            age: cells[3].textContent,
            email: cells[4].textContent,
            roles: cells[5].textContent
        };
    });

    function showEditModal(id) {
        const user = usersData[id];
        if (!user) {
            alert('User not found!');
            return;
        }
        document.getElementById('editId').value = user.id;
        document.getElementById('editIdDisplay').value = user.id;
        document.getElementById('editUsername').value = user.username;
        document.getElementById('editName').value = user.name;
        document.getElementById('editAge').value = user.age;
        document.getElementById('editEmail').value = user.email;
        document.getElementById('editPassword').value = '';


        document.getElementById('editForm').action = '/admin/update';

        new bootstrap.Modal(document.getElementById('editModal')).show();
    }

    function showDeleteModal(id) {
        const user = usersData[id];
        if (!user) {
            alert('User not found!');
            return;
        }
        document.getElementById('deleteIdDisplay').value = user.id;
        document.getElementById('deleteUsername').value = user.username;
        document.getElementById('deleteName').value = user.name;
        document.getElementById('deleteAge').value = user.age;
        document.getElementById('deleteEmail').value = user.email;


        document.getElementById('deleteForm').action = '/admin/delete/' + user.id;

        new bootstrap.Modal(document.getElementById('deleteModal')).show();
    }
</script>
</body>
</html>
