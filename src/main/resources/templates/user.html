<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #343a40; }
        .navbar-custom .navbar-brand { color: #fff; font-weight: bold; }
        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #fff;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #0d6efd;
            padding: 12px 20px;
            border-radius: 0;
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
        }
        .sidebar .nav-link:hover:not(.active) {
            background-color: #f8f9fa;
        }
        .main-content { padding: 20px; }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-dark navbar-custom">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            <span th:text="${user.username}">username</span>
            <span th:if="${user.roles != null}"> with roles:
                <span th:each="role, iterStat : ${user.roles}">
                    <span th:text="${role.name}"></span>
                    <span th:if="${!iterStat.last}"> </span>
                </span>
            </span>
        </span>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-link text-light text-decoration-none">Logout</button>
        </form>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <nav class="nav flex-column mt-2">
                <a class="nav-link" th:href="@{/admin}"
                   sec:authorize="hasRole('ROLE_ADMIN')">
                    Admin
                </a>
                <a class="nav-link active" href="/user">User</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">
            <h1 class="mb-4">User information-page</h1>

            <!-- Для АДМИНА: таблица всех пользователей -->
            <div sec:authorize="hasRole('ROLE_ADMIN')" class="card">
                <div class="card-header">All Users</div>
                <div class="card-body p-0">
                    <table class="table table-striped mb-0" id="allUsersTable">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Role</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Данные загрузятся через JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Для ОБЫЧНОГО ПОЛЬЗОВАТЕЛЯ: свои данные -->
            <div sec:authorize="!hasRole('ROLE_ADMIN')" class="card">
                <div class="card-header fw-bold">About user</div>
                <div class="card-body p-0">
                    <table class="table table-striped mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Role</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- ✅ ВОТ ЭТО ГЛАВНОЕ ИЗМЕНЕНИЕ -->
                        <!-- Мы вызываем метод getAllUsers() прямо из сервиса -->
                        <tr>
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.name}"></td>
                            <td th:text="${user.age}"></td>
                            <td th:text="${user.email}"></td>
                            <td>
                                <span th:each="role : ${user.roles}" th:text="${role.name} + ' '"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript для загрузки всех пользователей (только для админа) -->
<script th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}">
    // Загружаем всех пользователей через fetch API
    fetch('/admin/api/users')
        .then(response => response.json())
        .then(users => {
            const tbody = document.querySelector('#allUsersTable tbody');
            tbody.innerHTML = '';

            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.username}</td>
                    <td>${user.name}</td>
                    <td>${user.age}</td>
                    <td>${user.email}</td>
                    <td>${user.roles ? user.roles.map(r => r.name).join(' ') : ''}</td>
                `;
                tbody.appendChild(row);
            });
        })
        .catch(error => console.error('Error loading users:', error));
</script>
</body>
</html>
